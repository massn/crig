<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="300" fill="#0d1117" rx="15"/>
  
  <defs>
    <!-- Cyan Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Industrial Cable Gradient -->
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a3f4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1d23;stop-opacity:1" />
    </linearGradient>
    <!-- Text Grid Pattern -->
    <pattern id="grid" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#00f2ff" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Cables (Placed BEFORE Text to be behind) -->
  <g id="cables">
    <!-- Cable 1 (Top Left to Deep Bottom Left) -->
    <g>
      <path d="M -50 40 L 100 40 Q 140 40 140 100 L 140 220" stroke="url(#cableGrad)" stroke-width="20" fill="none" stroke-linecap="round" />
      <!-- Plug at the bottom -->
      <g transform="translate(140, 220)">
        <rect x="-14" y="0" width="28" height="40" fill="#2a2e38" stroke="#4a4f5d" />
        <rect x="-14" y="5" width="28" height="4" fill="#00f2ff" filter="url(#glow)" />
      </g>
    </g>

    <!-- Cable 2 (Bottom Right to High Top Right) -->
    <g>
      <path d="M 650 240 L 500 240 Q 460 240 460 180 L 460 40" stroke="url(#cableGrad)" stroke-width="20" fill="none" stroke-linecap="round" />
      <!-- Plug at the top -->
      <g transform="translate(460, 40) rotate(180)">
        <rect x="-14" y="0" width="28" height="40" fill="#2a2e38" stroke="#4a4f5d" />
        <rect x="-14" y="5" width="28" height="4" fill="#00f2ff" filter="url(#glow)" />
      </g>
    </g>
  </g>

  <!-- Main CRIG Text (Placed AFTER Cables to be in front) -->
  <text x="300" y="180" text-anchor="middle" fill="url(#grid)" stroke="#00f2ff" stroke-width="1.5" font-family="Orbitron, monospace" font-size="120" font-weight="900" letter-spacing="15" filter="url(#glow)">CRIG</text>
</svg>
